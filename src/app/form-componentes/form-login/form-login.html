<div class="login-container">
  <div class="login-card">
    <button class="close-button" (click)="closeForm()">×</button>
    <div class="login-header">
      <h1>Welcome Back</h1>
      <p>Sign in to your account</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 0.8rem">
      <label for="">Email</label>
      <input #email (click)="email.value = 'antoine.pellegrini@insidemail.com'" style="flex: 1" type="text">
    </div>

    <div style="display: flex; flex-direction: column; gap: 0.8rem">
      <label for="">Password</label>
      <input #password (click)="password.value = 'Very good password1!'" type="password">
    </div>

    <button (click)="this.closeForm()">Sign in</button>
  </div>
</div>

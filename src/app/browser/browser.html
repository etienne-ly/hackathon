<main>
  <section class="tabs">
    @for (tab of gameService.tabs; track tab) {
      <div (click)="currentTab = gameService.tabs.indexOf(tab)" class="tab {{ currentTab === gameService.tabs.indexOf(tab) ? 'active' : ''}}">
        <img src="{{tab.icon}}"/>
        <div class="tab-title">{{tab.title}}</div>
        <span (click)="currentTab = gameService.tabs.indexOf(tab) - 1; gameService.tabs.splice(gameService.tabs.indexOf(tab), 1);" class="material-symbols-rounded tab-close" style="font-size: 1rem;">close</span>
      </div>
    }
    <span (click)="gameService.tabs.push({title: 'Untitled', url: '', icon: ''}); currentTab = gameService.tabs.length - 1" class="material-symbols-rounded tab-button" style="font-size: 1.1rem;">add</span>
  </section>
  <section id="url">
    <span title="Navigate to previous page" class="material-symbols-rounded tab-button" style="font-size: 1.1rem; color: oklch(70.8% 0 0);">arrow_back</span>
    <span title="Navigate to next page" class="material-symbols-rounded tab-button" style="font-size: 1.1rem; color: oklch(70.8% 0 0);">arrow_forward</span>
    <span title="Reload this page" class="material-symbols-rounded tab-button" style="font-size: 1.1rem;">refresh</span>
    <span title="Monitor your home" class="material-symbols-rounded tab-button" style="font-size: 1.1rem;">home</span>
    <span title="Navigate to mail" class="material-symbols-rounded tab-button" style="font-size: 1.1rem;">mail</span>
    <div id="url-field">
      <span class="material-symbols-rounded" style="font-size: 1.1rem; color: oklch(55.6% 0 0);">search</span>
      <input class="url-input" type="text" value="{{''}}">
    </div>
  </section>
  <section class="content">
    <app-news-template></app-news-template>
  </section>
</main>
